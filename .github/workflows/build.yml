name: Build CodexImageFix

on:
  workflow_dispatch:
    # 手动触发（在 GitHub 仓库 Actions 页面点 Run workflow）
  push:
    tags:
      - 'v*'   # 打 v 开头的 tag 时自动触发发版

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: CodexImageFix-Windows
          - os: macos-latest
            artifact: CodexImageFix-Mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Read version
        id: version
        shell: bash
        run: |
          VER=$(python -c "import re; print(re.search(r'VERSION = \"([^\"]+)\"', open('codex_image_fix.py', encoding='utf-8').read()).group(1))")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "读取到版本 v$VER"

      - name: Build
        shell: bash
        run: |
          cd .
          pyinstaller --onefile --console --name "CodexImageFix-v${{ steps.version.outputs.version }}" --clean --noconfirm codex_image_fix.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-v${{ steps.version.outputs.version }}
          path: |
            dist/CodexImageFix*
          if-no-files-found: error

      # Mac：去掉可执行属性以外的压缩，保留裸二进制供直接下载运行
      - name: Prepare raw binary (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd ./dist
          F=$(ls CodexImageFix* | head -1)
          chmod +x "$F"
          mv "$F" "CodexImageFix-macOS"

      - name: Upload raw binary (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: CodexImageFix-macOS-v${{ steps.version.outputs.version }}
          path: dist/CodexImageFix-macOS
          if-no-files-found: error

  release:
    # 打 tag 触发时，自动创建 Release 并附上双平台产物
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: List files
        run: ls -la dist/

      - name: Create Release and upload raw files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CodexImageFix ${{ github.ref_name }}
          body: |
            ## 下载（点文件名直接下载，无需解压）

            - **Windows**：`CodexImageFix-Windows.exe` → 下载后直接双击
            - **Mac**：`CodexImageFix-macOS` → 下载后在终端执行 `chmod +x CodexImageFix-macOS`（仅首次），之后双击运行

            > Mac 首次打开如提示"无法验证开发者"：右键 → 打开，或到「系统设置 → 隐私与安全性」点「仍要打开」

            ## 使用

            双击运行，自动修复后按提示重启 Codex。
            详细变更见CHANGELOG.md
          files: |
            dist/CodexImageFix*
          draft: false
          prerelease: false
